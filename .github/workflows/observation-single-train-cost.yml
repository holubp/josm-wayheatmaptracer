name: Fixed original TRAIN cost accounting

on:
  push:
    branches: [codex/b-observation-cost-20261019]

permissions:
  contents: read

jobs:
  cost-accounting:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/b-observation-cost-20261019' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COST_FREEZE_SHA256: 2ab4b3e1a139c82b84ffda859e21419d4062c5fc7777c8eb2b16458c56e37da9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify external fixed freeze and exact push before compilation
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          freeze=Path("superpowers/docs/plans/2026-10-19-b-single-train-cost-freeze.json").read_bytes()
          expected=os.environ["COST_FREEZE_SHA256"]
          if not re.fullmatch("[0-9a-f]{64}",expected) or hashlib.sha256(freeze).hexdigest()!=expected:
              raise SystemExit("External fixed cost freeze mismatch")
          fields=json.loads(freeze)
          branch="refs/heads/codex/b-observation-cost-20261019"
          repository="holubp/josm-wayheatmaptracer"
          e=os.environ
          if fields.get("schema")!=1 or fields.get("purpose")!="SINGLE_ORIGINAL_TRAIN_FIXED_PATH_COST_ACCOUNTING" or fields.get("approval")!="APPROVED_AFTER_INDEPENDENT_REVIEW_AND_CONTROLLER_RULING" or fields.get("branch")!=branch:
              raise SystemExit("Fixed cost diagnostic pending review or wrong purpose")
          if e.get("GITHUB_ACTIONS")!="true" or e.get("GITHUB_EVENT_NAME")!="push" or e.get("GITHUB_RUN_ATTEMPT")!="1" or e.get("GITHUB_REF")!=branch or e.get("GITHUB_REPOSITORY")!=repository or not re.fullmatch("[0-9]{1,20}",e.get("GITHUB_RUN_ID","")) or not re.fullmatch("[0-9a-f]{40}",e.get("GITHUB_SHA","")) or e.get("GITHUB_WORKFLOW_REF")!=repository+"/.github/workflows/observation-single-train-cost.yml@"+branch:
              raise SystemExit("Exact first controlled push required")
          members=fields.get("members")
          if not isinstance(members,dict) or not members:
              raise SystemExit("Fixed source inventory required")
          for path,digest in members.items():
              member=Path(path)
              if member.is_absolute() or ".." in member.parts or member.is_symlink() or not re.fullmatch("[0-9a-f]{64}",digest) or hashlib.sha256(member.read_bytes()).hexdigest()!=digest:
                  raise SystemExit("Fixed cost source mismatch")
          PY
      - name: Compile fixed init additions outside diagnostic clock
        run: sh ./gradlew -I scripts/single-train-cost.init.gradle.kts compileJava compileObservationIdentifyJava observationIdentifyClasses --rerun-tasks --console=plain
      - name: Account only the two archived paths and stored witness once
        run: |
          set -eu
          timeout 360s sh ./gradlew -I scripts/single-train-cost.init.gradle.kts v022SingleTrainCostDiagnostic \
            -PsingleTrainCostFreezeSha256="$COST_FREEZE_SHA256" \
            -PsingleTrainCostOutput="$RUNNER_TEMP/josm-single-train-cost" --console=plain
      - name: Require complete nonqualifying exact cost evidence
        run: |
          python3 - <<'PY'
          import json, os, math, struct, re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"josm-single-train-cost"
          def require(condition):
              if not condition:
                  raise SystemExit("Complete fixed nonqualifying cost evidence required")
          def read(name):
              raw=(root/name).read_bytes()
              require(len(raw)<=65536)
              return json.loads(raw)
          status=read("status.json");binding=read("binding.json")
          freeze=json.loads(Path("superpowers/docs/plans/2026-10-19-b-single-train-cost-freeze.json").read_bytes())
          require(set(p.name for p in root.iterdir())==set(freeze["outputFiles"]))
          require(status.get("schema")==1 and status.get("status")=="COMPLETE_NONQUALIFYING_ACCOUNTING")
          require(status.get("purpose")==binding.get("purpose")=="SINGLE_ORIGINAL_TRAIN_FIXED_PATH_COST_ACCOUNTING")
          require(binding.get("freezeSha256")==os.environ["COST_FREEZE_SHA256"])
          require(binding.get("sourceProofOnly")=="94d7ea9a03134cab331b317a1764b0d517bd2dc1dea6d2a78482bcf8313dc6de")
          require(binding.get("case")=="sparse-crossing-noisy-strands-vs-persistent-parallel/train/v0/right")
          require(binding.get("witnessMemberSha256")=="306df0ebe59f052104883c8113823a127176c254510faebf10b32ff896fba5ad")
          require(status.get("selectionAuthority")==binding.get("selectionAuthority")=="NONE")
          require(status.get("rasterReads")==status.get("labelReads")==1 and status.get("selectReads")==status.get("holdoutReads")==0)
          require(status.get("newMapSolves")==status.get("newSearches")==0 and status.get("completedPathAccounts")==4)
          require(status.get("ownerBytesAfterClose")==0 and status.get("uncertainOrdinaryReservationBytes")==0)
          require(isinstance(status.get("peakAccountedBytes"),int) and 0<status["peakAccountedBytes"]<=67108864)
          require(isinstance(status.get("diskChargeBeforeStatusUpperBound"),int) and 0<status["diskChargeBeforeStatusUpperBound"]<=2147483648)
          counts=status.get("counts",{})
          require(counts.get("adapterEvaluations")==162 and counts.get("profileTerms")==324 and counts.get("pairTerms")==320 and counts.get("tripleTerms")==316)
          require(isinstance(counts.get("primitiveCalls"),int) and 0<counts["primitiveCalls"]<=4096 and isinstance(counts.get("selectedCellComponentRecords"),int) and 0<counts["selectedCellComponentRecords"]<=972)
          phases=status.get("phases",{})
          require(set(phases)=={"ACQUISITION","DECODE","B0_EVALUATION","B0_ACCOUNT","B1_EVALUATION","B1_ACCOUNT"})
          require(all(c=={"attempted":1,"succeeded":1,"failed":0,"active":0} for c in phases.values()))
          classes=binding.get("runtimeClassSha256",{})
          require(len(classes)==9 and all(isinstance(v,str) and re.fullmatch("[0-9a-f]{64}",v) for v in classes.values()))
          witness=json.loads(Path("src/test/resources/b-single-train-cost/witness.json").read_bytes())
          def bits(value):
              require(isinstance(value,(int,float)) and not isinstance(value,bool) and math.isfinite(value))
              return format(struct.unpack(">Q",struct.pack(">d",value))[0],"x")
          for b in range(2):
              summary=read(f"summary-B{b}.json")
              archive=json.loads(Path(f"src/test/resources/b-single-train-geometry/G1-L1-B{b}.json").read_bytes())
              require(summary.get("purpose")==binding["purpose"] and summary.get("freezeSha256")==binding["freezeSha256"] and summary.get("parameter")==f"G1-L1-B{b}" and summary.get("modelHash")==archive["rawGeometry"]["modelHash"])
              require(summary.get("selectionAuthority")=="NONE" and summary.get("input")==archive["input"] and summary.get("archivedEnergyBitExact") is True)
              require(summary.get("witnessMemberSha256")==binding["witnessMemberSha256"])
              require(bits(summary.get("archivedEnergy"))==summary.get("archivedEnergyBits")==bits(archive["rawGeometry"]["mapEnergy"]))
              availability=summary.get("witnessAvailability");energy=summary.get("witnessEnergy")
              if availability=="FINITE_FIXED_CONTROL_NOT_OPTIMAL_OR_PLAUSIBILITY_PROOF":
                  bits(energy)
              else:
                  require(availability=="UNAVAILABLE_NONFINITE_NO_REPLACEMENT" and energy in ("NEGATIVE_INFINITY","POSITIVE_INFINITY","NONFINITE_NAN"))
              rows=[]
              for c in range(11):
                  detail=read(f"detail-B{b}-{c:02d}.json")
                  require(detail.get("schema")==1 and detail.get("parameter")==f"G1-L1-B{b}" and len(detail.get("profiles",[]))==(8 if c<10 else 1))
                  rows.extend(detail["profiles"])
              require([r.get("profile") for r in rows]==list(range(81)))
              for i,row in enumerate(rows):
                  paths=row.get("paths",[])
                  require(len(paths)==2 and paths[0].get("path")=="ARCHIVED_MAP" and paths[1].get("path")=="STORED_GEOMETRY_ONLY_WITNESS")
                  require(paths[0].get("state")==archive["rawGeometry"]["mapStateIndices"][i] and paths[1].get("state")==witness["states"][i] and paths[1].get("point")==witness["points"][i])
              require(bits(rows[-1]["paths"][0]["prefixEnergy"])==bits(summary["archivedEnergy"]))
              last=rows[-1]["paths"][1]["prefixEnergy"]
              require(bits(last)==bits(energy) if isinstance(energy,(int,float)) else last==energy)
          for p in range(6):
              progress=read(f"progress-{p:02d}.json")
              require(progress.get("schema")==1 and sum(r.get("active",0) for r in progress.get("phases",{}).values())==1)
          PY
      - name: Upload only fixed public accounting leaves
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-single-train-cost
          path: |
            ${{ runner.temp }}/josm-single-train-cost/binding.json
            ${{ runner.temp }}/josm-single-train-cost/status.json
            ${{ runner.temp }}/josm-single-train-cost/summary-B0.json
            ${{ runner.temp }}/josm-single-train-cost/summary-B1.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B0-00.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B0-01.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B0-02.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B0-03.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B0-04.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B0-05.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B0-06.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B0-07.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B0-08.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B0-09.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B0-10.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B1-00.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B1-01.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B1-02.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B1-03.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B1-04.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B1-05.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B1-06.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B1-07.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B1-08.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B1-09.json
            ${{ runner.temp }}/josm-single-train-cost/detail-B1-10.json
            ${{ runner.temp }}/josm-single-train-cost/progress-00.json
            ${{ runner.temp }}/josm-single-train-cost/progress-01.json
            ${{ runner.temp }}/josm-single-train-cost/progress-02.json
            ${{ runner.temp }}/josm-single-train-cost/progress-03.json
            ${{ runner.temp }}/josm-single-train-cost/progress-04.json
            ${{ runner.temp }}/josm-single-train-cost/progress-05.json
          if-no-files-found: warn
          retention-days: 30
