name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  public-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public validation dependencies
        run: python3 -m pip install "pytest==9.1.1" "PyYAML==6.0.2"
      - name: Prepare pinned JOSM 19555 host
        run: |
          python3 scripts/prepare-ci-josm19555.py --output-dir "$RUNNER_TEMP/josm19555-host"
          echo "ORG_GRADLE_PROJECT_josm19555HostJar=$RUNNER_TEMP/josm19555-host/JOSM-Linux-java11-19555.jar" >> "$GITHUB_ENV"
      - name: Run public validation
        id: public-validation
        run: python3 scripts/run-validation.py --profile public --output "$RUNNER_TEMP/josm-public-validation"
      - name: Include JOSM host receipt in public evidence
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/josm19555-host/host-runtime.json"; then
            mkdir -p "$RUNNER_TEMP/josm-public-validation/reports/java/html"
            cp "$RUNNER_TEMP/josm19555-host/host-runtime.json" "$RUNNER_TEMP/josm-public-validation/reports/java/html/host-runtime.json"
          fi
      - name: Upload public validation reports and status
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-validation-evidence
          path: |
            ${{ runner.temp }}/josm-public-validation/reports/java/junit-xml/
            ${{ runner.temp }}/josm-public-validation/reports/java/html/
            ${{ runner.temp }}/josm-public-validation/summary.json
            ${{ runner.temp }}/josm-public-validation/status.json
            ${{ runner.temp }}/josm-public-validation/stages/java-build.log
          if-no-files-found: ignore
          retention-days: 5
      - name: Upload validated plugin jar
        uses: actions/upload-artifact@v4
        if: steps.public-validation.outcome == 'success'
        with:
          name: public-validated-wayheatmaptracer
          path: ${{ runner.temp }}/josm-public-validation/artifacts/wayheatmaptracer.jar
          if-no-files-found: error
          retention-days: 5

  public-gui-smoke:
    needs: public-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: PROBABILISTIC
            report: public-gui-smoke
          - engine: LEGACY_THEN_B
            report: public-gui-smoke-hybrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare pinned JOSM 19555 host
        run: |
          python3 scripts/prepare-ci-josm19555.py --output-dir "$RUNNER_TEMP/josm19555-host"
          echo "ORG_GRADLE_PROJECT_josm19555HostJar=$RUNNER_TEMP/josm19555-host/JOSM-Linux-java11-19555.jar" >> "$GITHUB_ENV"
      - name: Check Xvfb runner availability
        run: command -v xvfb-run
      - name: Run public synthetic GUI smoke test
        run: timeout 600s xvfb-run -a -s '-screen 0 1920x1080x24' sh gradlew v022PublicGuiSmoke -PpublicGuiEngine=${{ matrix.engine }} --console=plain
      - name: Include JOSM host receipt in GUI report
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/josm19555-host/host-runtime.json"; then
            mkdir -p "build/reports/${{ matrix.report }}"
            cp "$RUNNER_TEMP/josm19555-host/host-runtime.json" "build/reports/${{ matrix.report }}/host-runtime.json"
          fi
      - name: Require public GUI smoke summary after a passing run
        if: success()
        run: test -s build/reports/${{ matrix.report }}/summary.json
      - name: Upload public GUI smoke summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.report }}-summary
          path: build/reports/${{ matrix.report }}/summary.json
          if-no-files-found: ignore
          retention-days: 5
      - name: Upload public GUI host receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.report }}-host-runtime
          path: build/reports/${{ matrix.report }}/host-runtime.json
          if-no-files-found: ignore
          retention-days: 5

  legacy-normal-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare pinned JOSM 19555 host
        run: |
          python3 scripts/prepare-ci-josm19555.py --output-dir "$RUNNER_TEMP/josm19555-host"
          echo "ORG_GRADLE_PROJECT_josm19555HostJar=$RUNNER_TEMP/josm19555-host/JOSM-Linux-java11-19555.jar" >> "$GITHUB_ENV"
      - name: Run three fresh public Legacy normal-policy forks
        env:
          PERF_ROOT: ${{ runner.temp }}/legacy-normal-performance
        run: |
          mkdir -p "$PERF_ROOT"
          : > "$PERF_ROOT/invocations.txt"
          failed=0
          for fork in 0 1 2; do
            if sh gradlew legacyNormalPerformance \
                -PlegacyNormalPerformanceFork="$fork" \
                -PlegacyNormalPerformanceOutput="$PERF_ROOT/fork-$fork" \
                --console=plain; then
              result=0
            else
              result=$?
            fi
            printf 'fork=%s exit=%s\n' "$fork" "$result" >> "$PERF_ROOT/invocations.txt"
            if test "$result" -ne 0; then failed=1; fi
          done
          exit "$failed"
      - name: Gate raw fork results
        if: always()
        env:
          PERF_ROOT: ${{ runner.temp }}/legacy-normal-performance
        run: |
          python3 scripts/legacy-normal-performance-gate.py \
            --fork-dir "$PERF_ROOT/fork-0" \
            --fork-dir "$PERF_ROOT/fork-1" \
            --fork-dir "$PERF_ROOT/fork-2" \
            --report "$PERF_ROOT/gate-report.json"
      - name: Upload public Legacy normal-policy evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-legacy-normal-performance
          path: ${{ runner.temp }}/legacy-normal-performance/
          if-no-files-found: ignore
          retention-days: 5

  legacy-tracker-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare pinned JOSM 19555 host
        run: |
          python3 scripts/prepare-ci-josm19555.py --output-dir "$RUNNER_TEMP/josm19555-host"
          echo "ORG_GRADLE_PROJECT_josm19555HostJar=$RUNNER_TEMP/josm19555-host/JOSM-Linux-java11-19555.jar" >> "$GITHUB_ENV"
      - name: Run three fresh public Legacy tracker-policy forks
        env:
          PERF_ROOT: ${{ runner.temp }}/legacy-tracker-performance
          TRACKER_POLICY: native-reciprocal-support-paired-chord-v3
        run: |
          mkdir -p "$PERF_ROOT"
          : > "$PERF_ROOT/invocations.txt"
          failed=0
          for fork in 0 1 2; do
            if sh gradlew legacyNormalPerformance \
                -PlegacyNormalPerformanceFork="$fork" \
                -PlegacyNormalPerformanceOutput="$PERF_ROOT/fork-$fork" \
                -PlegacyTrackerPerformancePolicy="$TRACKER_POLICY" \
                --console=plain; then
              result=0
            else
              result=$?
            fi
            printf 'fork=%s exit=%s\n' "$fork" "$result" >> "$PERF_ROOT/invocations.txt"
            if test "$result" -ne 0; then failed=1; fi
          done
          exit "$failed"
      - name: Gate raw tracker-policy fork results
        if: always()
        env:
          PERF_ROOT: ${{ runner.temp }}/legacy-tracker-performance
        run: |
          python3 scripts/legacy-tracker-performance-gate.py \
            --candidate-policy native-reciprocal-support-paired-chord-v3 \
            --fork-dir "$PERF_ROOT/fork-0" \
            --fork-dir "$PERF_ROOT/fork-1" \
            --fork-dir "$PERF_ROOT/fork-2" \
            --report "$PERF_ROOT/gate-report.json"
      - name: Upload public Legacy tracker-policy evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-legacy-tracker-performance
          path: ${{ runner.temp }}/legacy-tracker-performance/
          if-no-files-found: ignore
          retention-days: 5
