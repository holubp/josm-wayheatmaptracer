name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      observation_diagnostics:
        description: Run the fixed public renderer diagnostic instead of model fitting
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  observation-identification:
    if: github.event_name == 'workflow_dispatch' && inputs.observation_diagnostics != true
    uses: ./.github/workflows/observation-identification.yml

  observation-public-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.observation_diagnostics == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Diagnose the fixed public renderer and bound receipt
        run: |
          mkdir -p build/reports/public-observation-renderer
          timeout 600s sh ./gradlew v022ObservationRendererDiagnostics --console=plain > build/reports/public-observation-renderer/diagnostic.log 2>&1
      - name: Upload only public renderer diagnostic evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-observation-renderer-diagnostic
          path: |
            build/reports/public-observation-renderer/diagnostic.log
            build/reports/public-observation-renderer/receipt/binding.json
            build/reports/public-observation-renderer/receipt/bound-geometry.csv
          if-no-files-found: error
          retention-days: 5

  public-validation:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public validation dependencies
        run: python3 -m pip install "pytest==9.1.1" "PyYAML==6.0.2"
      - name: Run public validation
        id: public-validation
        run: python3 scripts/run-validation.py --profile public --output "$RUNNER_TEMP/josm-public-validation"
      - name: Upload public validation reports and status
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-validation-evidence
          path: |
            ${{ runner.temp }}/josm-public-validation/reports/java/junit-xml/
            ${{ runner.temp }}/josm-public-validation/reports/java/html/
            ${{ runner.temp }}/josm-public-validation/summary.json
            ${{ runner.temp }}/josm-public-validation/status.json
          if-no-files-found: ignore
          retention-days: 5
      - name: Upload validated plugin jar
        uses: actions/upload-artifact@v4
        if: steps.public-validation.outcome == 'success'
        with:
          name: public-validated-wayheatmaptracer
          path: ${{ runner.temp }}/josm-public-validation/artifacts/wayheatmaptracer.jar
          if-no-files-found: error
          retention-days: 5

  public-gui-smoke:
    needs: public-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check Xvfb runner availability
        run: command -v xvfb-run
      - name: Run public synthetic GUI smoke test
        run: timeout 600s xvfb-run -a -s '-screen 0 1920x1080x24' sh gradlew v022PublicGuiSmoke --console=plain
      - name: Require public GUI smoke summary after a passing run
        if: success()
        run: test -s build/reports/public-gui-smoke/summary.json
      - name: Upload public GUI smoke summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-gui-smoke-summary
          path: build/reports/public-gui-smoke/summary.json
          if-no-files-found: ignore
          retention-days: 5
