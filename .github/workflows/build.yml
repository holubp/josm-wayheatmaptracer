name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  public-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public validation dependencies
        run: python3 -m pip install "pytest==9.1.1" "PyYAML==6.0.2"
      - name: Prepare pinned JOSM 19555 host
        run: |
          python3 scripts/prepare-ci-josm19555.py --output-dir "$RUNNER_TEMP/josm19555-host"
          echo "ORG_GRADLE_PROJECT_josm19555HostJar=$RUNNER_TEMP/josm19555-host/JOSM-Linux-java11-19555.jar" >> "$GITHUB_ENV"
      - name: Run public validation
        id: public-validation
        run: python3 scripts/run-validation.py --profile public --output "$RUNNER_TEMP/josm-public-validation"
      - name: Include JOSM host receipt in public evidence
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/josm19555-host/host-runtime.json"; then
            mkdir -p "$RUNNER_TEMP/josm-public-validation/reports/java/html"
            cp "$RUNNER_TEMP/josm19555-host/host-runtime.json" "$RUNNER_TEMP/josm-public-validation/reports/java/html/host-runtime.json"
          fi
      - name: Upload public validation reports and status
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-validation-evidence
          path: |
            ${{ runner.temp }}/josm-public-validation/reports/java/junit-xml/
            ${{ runner.temp }}/josm-public-validation/reports/java/html/
            ${{ runner.temp }}/josm-public-validation/summary.json
            ${{ runner.temp }}/josm-public-validation/status.json
            ${{ runner.temp }}/josm-public-validation/stages/*.log
          if-no-files-found: ignore
          retention-days: 5
      - name: Upload validated plugin jar
        uses: actions/upload-artifact@v4
        if: steps.public-validation.outcome == 'success'
        with:
          name: public-validated-wayheatmaptracer
          path: ${{ runner.temp }}/josm-public-validation/artifacts/wayheatmaptracer.jar
          if-no-files-found: error
          retention-days: 5

  g004-focused-tests:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/codex/g004-stepwise-20261119' || github.ref == 'refs/heads/codex/g004-smoothing-adapter-20261121')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare pinned JOSM 19555 host
        run: |
          python3 scripts/prepare-ci-josm19555.py --output-dir "$RUNNER_TEMP/josm19555-host"
          echo "ORG_GRADLE_PROJECT_josm19555HostJar=$RUNNER_TEMP/josm19555-host/JOSM-Linux-java11-19555.jar" >> "$GITHUB_ENV"
      - name: Run focused public JUnit tests
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/heads/codex/g004-stepwise-20261119)
              filters=(--tests '*VisibleRefinementWorkflowTest' --tests '*RefinementAttemptDiagnosticsTest' --tests '*RefinementLineageCodecTest' --tests '*RefinementSessionTest' --tests '*PluginPreferencesTest' --tests '*RefinementRootAuthorityTest' --tests '*HeatmapSettingsDialogTest' --tests '*V022LiveBPreviewServiceTest.distantCompleteReceiverKeepsInteriorJunctionFixedDuringCapture' --tests '*V022LiveBPreviewServiceTest.managedCompleteSourceSetRunsNativeAndAggregateSeparately' --tests '*RefinementSmoothingAdapterTest' --tests '*SmoothingParentBinderTest' --tests '*SmoothingWorkContextTest' --tests '*RetainedSmoothingRootTest' --tests '*ModernRefinementBootstrapTest' --tests '*RefinementControlsTest' --tests '*RefinementReviewLifecycleTest' --tests '*StepwiseRefinementApplyTest' --tests '*StepwiseRefinementOwnershipTest' --tests '*LegacyRefinementWorkflowTest' --tests '*LegacyVisibleRefinementBootstrapTest' --tests '*RuntimeRefinementDiagnosticsTest' --tests '*RefinementPipelineTest' --tests '*RefinementIntervalPlannerTest' --tests '*OrdinaryModernApplyPreparationTest.originalCaptureReceiptSurvivesPlanPreparation')
              filters+=(--tests '*OrdinaryModernApplyPreparationTest.noChangeIsCurrentOnlyForTheExactCapturedNetworkAndCreatesNoHistory')
              filters+=(--tests '*V022FixedIntervalEditPlanComposerTest.allUsableUnchangedIntervalsRequireTheirOwnValidatedGraphProof' --tests '*V022FixedIntervalEditPlanComposerTest.geometricallyUnchangedRouteIsNotReportedAsALocalFailure')
              filters+=(--tests '*AlignWayActionTest.noRouteFromManualJunctionShowsInstructionWhileOrdinaryNoRouteKeepsItsReason' --tests '*AlignWayActionTest.intervalExportFailureRetainsActualBatchWorkWithoutClaimingFullWayInference')
              filters+=(--tests '*VisibleRenderPolicyTest')
              filters+=(--tests '*AlignWayActionTest.refinementApplyFailureDiagnosticsKeepBoundedSafeCauseAndBoundary')
              filters+=(--tests '*RefinementAcquisitionTest.frozenVisiblePlanConvertsSameEpochPixelsAndRejectsShortFrameBeforeScalarWork')
              filters+=(--tests '*BenchmarkDecisionComparatorIntegrationTest.selectedObservationRejectsAbsentStaleAndSameCoreMissingWitnessOwners' --tests '*AlignWayActionTest.ordinaryBRouteFreezesSupportedSettingsWithoutChangingRequestedPreferences' --tests '*V022PreviewStateTest.t116SupportedLiveEnginePersistsWhileOtherSettingsAndHistoricalIdentityRemain' --tests '*VisibleEvidencePlanTest.pointsAndDecisionFitDoNotProveCompleteEngineSupport')
              ;;
            refs/heads/codex/g004-smoothing-adapter-20261121)
              filters=(
                --tests '*RefinementSmoothingAdapterTest'
                --tests '*PostprocessingValidationWorkTest'
                --tests '*PostprocessedReferrerWorkTest'
                --tests '*PostprocessedWayReferenceWorkTest'
              )
              ;;
            *)
              echo "Unsupported ref for focused G004 tests" >&2
              exit 2
              ;;
          esac
          sh gradlew --no-daemon test --console=plain -PvalidationProfile=public "${filters[@]}"
      - name: Require selected JUnit XML after a passing run
        if: success()
        env:
          FOCUSED_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          names = {
              "refs/heads/codex/g004-stepwise-20261119": [
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.VisibleRefinementWorkflowTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.refinement.RefinementAttemptDiagnosticsTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.diagnostics.replay.format15.RefinementLineageCodecTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.refinement.RefinementSessionTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.config.PluginPreferencesTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.refinement.RefinementRootAuthorityTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.ui.HeatmapSettingsDialogTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.V022LiveBPreviewServiceTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.refinement.RefinementSmoothingAdapterTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.refinement.SmoothingParentBinderTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.refinement.SmoothingWorkContextTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.refinement.RetainedSmoothingRootTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.ModernRefinementBootstrapTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.tracing.V022FixedIntervalEditPlanComposerTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.actions.AlignWayActionTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.imagery.VisibleRenderPolicyTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.BenchmarkDecisionComparatorIntegrationTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.ui.V022PreviewStateTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.refinement.VisibleEvidencePlanTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.refinement.RefinementAcquisitionTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.ui.RefinementControlsTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.ui.RefinementReviewLifecycleTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.actions.StepwiseRefinementApplyTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.actions.StepwiseRefinementOwnershipTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.LegacyRefinementWorkflowTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.LegacyVisibleRefinementBootstrapTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.refinement.RuntimeRefinementDiagnosticsTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.refinement.RefinementPipelineTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.refinement.RefinementIntervalPlannerTest.xml",
              ],
              "refs/heads/codex/g004-smoothing-adapter-20261121": [
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.refinement.RefinementSmoothingAdapterTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.refinement.PostprocessingValidationWorkTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.service.tracing.PostprocessedReferrerWorkTest.xml",
                  "TEST-org.openstreetmap.josm.plugins.wayheatmaptracer.model.PostprocessedWayReferenceWorkTest.xml",
              ],
          }
          selected = names[os.environ["FOCUSED_REF"]]
          results = Path("build/test-results/test")
          expected = {name.removeprefix("TEST-").removesuffix(".xml") for name in selected}
          found = {}
          for path in results.glob("TEST-*.xml"):
              suite = ET.parse(path).getroot()
              name = suite.get("name")
              if name in expected:
                  if name in found:
                      raise SystemExit("Duplicate selected JUnit suite: " + name)
                  if int(suite.get("tests", "0")) < 1 or any(int(suite.get(key, "0")) for key in ("failures", "errors", "skipped")):
                      raise SystemExit("Selected JUnit suite did not execute cleanly: " + name)
                  found[name] = path
          missing = sorted(expected - set(found))
          if missing:
              raise SystemExit("Missing selected JUnit XML: " + ", ".join(missing))
          PY
      - name: Stage only selected JUnit XML
        if: always()
        env:
          FOCUSED_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          classes = {
              "refs/heads/codex/g004-stepwise-20261119": ["VisibleRefinementWorkflowTest", "RefinementAttemptDiagnosticsTest", "RefinementLineageCodecTest", "RefinementSessionTest", "PluginPreferencesTest", "RefinementRootAuthorityTest", "HeatmapSettingsDialogTest", "V022LiveBPreviewServiceTest", "RefinementSmoothingAdapterTest", "SmoothingParentBinderTest", "SmoothingWorkContextTest", "RetainedSmoothingRootTest", "ModernRefinementBootstrapTest", "RefinementControlsTest", "RefinementReviewLifecycleTest", "StepwiseRefinementApplyTest", "StepwiseRefinementOwnershipTest", "LegacyRefinementWorkflowTest", "LegacyVisibleRefinementBootstrapTest", "RuntimeRefinementDiagnosticsTest", "RefinementPipelineTest", "RefinementIntervalPlannerTest", "OrdinaryModernApplyPreparationTest"],
              "refs/heads/codex/g004-smoothing-adapter-20261121": [
                  "RefinementSmoothingAdapterTest",
                  "PostprocessingValidationWorkTest",
                  "PostprocessedReferrerWorkTest",
                  "PostprocessedWayReferenceWorkTest",
              ],
          }
          classes["refs/heads/codex/g004-stepwise-20261119"].append("V022FixedIntervalEditPlanComposerTest")
          classes["refs/heads/codex/g004-stepwise-20261119"].append("AlignWayActionTest")
          classes["refs/heads/codex/g004-stepwise-20261119"].append("VisibleRenderPolicyTest")
          classes["refs/heads/codex/g004-stepwise-20261119"].extend(["BenchmarkDecisionComparatorIntegrationTest", "V022PreviewStateTest", "VisibleEvidencePlanTest", "RefinementAcquisitionTest"])
          selected = classes[os.environ["FOCUSED_REF"]]
          source = Path("build/test-results/test")
          destination = Path("build/reports/g004-focused-artifact/junit")
          destination.mkdir(parents=True, exist_ok=True)
          for report in source.glob("TEST-*.xml") if source.is_dir() else ():
              if any(report.name.endswith("." + class_name + ".xml") for class_name in selected):
                  shutil.copy2(report, destination / report.name)
          PY
      - name: Write focused source identity receipt
        if: always()
        env:
          FOCUSED_REF: ${{ github.ref }}
          FOCUSED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          test_names = {
              "refs/heads/codex/g004-stepwise-20261119": [
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/VisibleRefinementWorkflowTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/refinement/RefinementAttemptDiagnosticsTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/diagnostics/replay/format15/RefinementLineageCodecTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/refinement/RefinementSessionTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/config/PluginPreferencesTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/refinement/RefinementRootAuthorityTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/ui/HeatmapSettingsDialogTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/V022LiveBPreviewServiceTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/refinement/RefinementSmoothingAdapterTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/refinement/SmoothingParentBinderTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/refinement/SmoothingWorkContextTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/refinement/RetainedSmoothingRootTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/ModernRefinementBootstrapTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/tracing/V022FixedIntervalEditPlanComposerTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/actions/AlignWayActionTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/imagery/VisibleRenderPolicyTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/BenchmarkDecisionComparatorIntegrationTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/ui/V022PreviewStateTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/refinement/VisibleEvidencePlanTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/refinement/RefinementAcquisitionTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/ui/RefinementControlsTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/ui/RefinementReviewLifecycleTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/actions/StepwiseRefinementApplyTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/actions/StepwiseRefinementOwnershipTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/LegacyRefinementWorkflowTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/LegacyVisibleRefinementBootstrapTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/refinement/RuntimeRefinementDiagnosticsTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/refinement/RefinementPipelineTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/refinement/RefinementIntervalPlannerTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/actions/OrdinaryModernApplyPreparationTest.java",
              ],
              "refs/heads/codex/g004-smoothing-adapter-20261121": [
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/refinement/RefinementSmoothingAdapterTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/refinement/PostprocessingValidationWorkTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/service/tracing/PostprocessedReferrerWorkTest.java",
                  "org/openstreetmap/josm/plugins/wayheatmaptracer/model/PostprocessedWayReferenceWorkTest.java",
              ],
          }
          package_root = Path("src/main/java/org/openstreetmap/josm/plugins/wayheatmaptracer")
          source_roots = [package_root / name for name in ("service", "model", "actions", "util")]
          paths = sorted(path for root in source_roots for path in root.rglob("*.java"))
          selected_tests = [Path("src/test/java") / name for name in test_names[os.environ["FOCUSED_REF"]]]
          missing_tests = [path.as_posix() for path in selected_tests if not path.is_file()]
          if missing_tests:
              raise SystemExit("Selected test source is missing: " + ", ".join(missing_tests))
          paths.extend(selected_tests)
          hashes = {}
          for path in paths:
              relative = path.as_posix()
              hashes[relative] = hashlib.sha256(path.read_bytes()).hexdigest()
          receipt = {
              "schema": "g004-focused-source-identity-v1",
              "sourceCommit": os.environ["FOCUSED_SHA"],
              "ref": os.environ["FOCUSED_REF"],
              "sha256": hashes,
          }
          output = Path("build/reports/g004-focused/source-identity.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload focused JUnit XML and source identity
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g004-focused-junit-and-source-identity
          path: |
            build/reports/g004-focused-artifact/junit/*.xml
            build/reports/g004-focused/source-identity.json
          if-no-files-found: ignore
          retention-days: 5

  public-gui-smoke:
    needs: public-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: PROBABILISTIC
            report: public-gui-smoke-migrate-b
            mode: PRECISE_SHAPE
            order: A_B
          - engine: PROBABILISTIC
            report: public-gui-smoke-native-interval
            mode: PRECISE_SHAPE
            order: INTERVAL
          - engine: LEGACY_THEN_B
            report: public-gui-smoke-migrate-sequential
            mode: PRECISE_SHAPE
            order: A_B
          - engine: CORRIDOR_AWARE
            report: public-gui-smoke-migrate-a
            mode: MOVE_EXISTING_NODES
            order: A_B
          - engine: CORRIDOR_AWARE
            report: public-gui-smoke-native-a-precise
            mode: PRECISE_SHAPE
            order: A_B
          - engine: PROBABILISTIC
            report: public-gui-smoke-native-b-move
            mode: MOVE_EXISTING_NODES
            order: B_A
          - engine: PROBABILISTIC
            report: public-gui-smoke-visible-b-move
            mode: MOVE_EXISTING_NODES
            order: VISIBLE_B_A
          - engine: PROBABILISTIC
            report: public-gui-smoke-visible-stable-b-move
            mode: MOVE_EXISTING_NODES
            order: VISIBLE_B_A_STABLE
          - engine: LEGACY_V02
            report: public-gui-smoke-stepwise-precise-a-b
            mode: PRECISE_SHAPE
            order: A_B
          - engine: LEGACY_V02
            report: public-gui-smoke-stepwise-precise-b-a
            mode: PRECISE_SHAPE
            order: B_A
          - engine: LEGACY_V02
            report: public-gui-smoke-stepwise-move-a-b
            mode: MOVE_EXISTING_NODES
            order: A_B
          - engine: LEGACY_V02
            report: public-gui-smoke-stepwise-move-b-a
            mode: MOVE_EXISTING_NODES
            order: B_A
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare pinned JOSM 19555 host
        run: |
          python3 scripts/prepare-ci-josm19555.py --output-dir "$RUNNER_TEMP/josm19555-host"
          echo "ORG_GRADLE_PROJECT_josm19555HostJar=$RUNNER_TEMP/josm19555-host/JOSM-Linux-java11-19555.jar" >> "$GITHUB_ENV"
      - name: Check Xvfb runner availability
        run: command -v xvfb-run
      - name: Run public synthetic GUI smoke test
        run: timeout 600s xvfb-run -a -s '-screen 0 1920x1080x24' sh gradlew v022PublicGuiSmoke -PpublicGuiEngine=${{ matrix.engine }} -PpublicGuiAlignmentMode=${{ matrix.mode }} -PpublicGuiRefinementOrder=${{ matrix.order }} --console=plain
      - name: Include JOSM host receipt in GUI report
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/josm19555-host/host-runtime.json"; then
            mkdir -p "build/reports/${{ matrix.report }}"
            cp "$RUNNER_TEMP/josm19555-host/host-runtime.json" "build/reports/${{ matrix.report }}/host-runtime.json"
          fi
      - name: Require public GUI smoke summary after a passing run
        if: success()
        run: test -s build/reports/${{ matrix.report }}/summary.json
      - name: Upload public GUI smoke summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.report }}-summary
          path: build/reports/${{ matrix.report }}/summary.json
          if-no-files-found: ignore
          retention-days: 5
      - name: Upload public GUI host receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.report }}-host-runtime
          path: build/reports/${{ matrix.report }}/host-runtime.json
          if-no-files-found: ignore
          retention-days: 5

  g004-gui-diagnostic:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/g004-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: PROBABILISTIC
            report: public-gui-smoke-native-interval
            mode: PRECISE_SHAPE
            order: INTERVAL
          - engine: PROBABILISTIC
            report: public-gui-smoke-migrate-b
            mode: PRECISE_SHAPE
            order: A_B
          - engine: CORRIDOR_AWARE
            report: public-gui-smoke-migrate-a
            mode: MOVE_EXISTING_NODES
            order: A_B
          - engine: CORRIDOR_AWARE
            report: public-gui-smoke-native-a-precise
            mode: PRECISE_SHAPE
            order: A_B
          - engine: PROBABILISTIC
            report: public-gui-smoke-native-b-move
            mode: MOVE_EXISTING_NODES
            order: B_A
          - engine: PROBABILISTIC
            report: public-gui-smoke-visible-b-move
            mode: MOVE_EXISTING_NODES
            order: VISIBLE_B_A
          - engine: PROBABILISTIC
            report: public-gui-smoke-visible-stable-b-move
            mode: MOVE_EXISTING_NODES
            order: VISIBLE_B_A_STABLE
          - engine: LEGACY_V02
            report: public-gui-smoke-stepwise-precise-a-b
            mode: PRECISE_SHAPE
            order: A_B
          - engine: LEGACY_V02
            report: public-gui-smoke-stepwise-precise-b-a
            mode: PRECISE_SHAPE
            order: B_A
          - engine: LEGACY_V02
            report: public-gui-smoke-stepwise-move-a-b
            mode: MOVE_EXISTING_NODES
            order: A_B
          - engine: LEGACY_V02
            report: public-gui-smoke-stepwise-move-b-a
            mode: MOVE_EXISTING_NODES
            order: B_A
          - engine: LEGACY_THEN_B
            report: public-gui-smoke-migrate-sequential
            mode: PRECISE_SHAPE
            order: A_B
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare pinned JOSM 19555 host
        run: |
          python3 scripts/prepare-ci-josm19555.py --output-dir "$RUNNER_TEMP/josm19555-host"
          echo "ORG_GRADLE_PROJECT_josm19555HostJar=$RUNNER_TEMP/josm19555-host/JOSM-Linux-java11-19555.jar" >> "$GITHUB_ENV"
      - name: Check Xvfb runner availability
        run: command -v xvfb-run
      - name: Run diagnostic Legacy GUI smoke test
        run: timeout 600s xvfb-run -a -s '-screen 0 1920x1080x24' sh gradlew v022PublicGuiSmoke -PpublicGuiEngine=${{ matrix.engine }} -PpublicGuiAlignmentMode=${{ matrix.mode }} -PpublicGuiRefinementOrder=${{ matrix.order }} --console=plain
      - name: Include JOSM host receipt in diagnostic GUI report
        if: always()
        run: |
          if test -s "$RUNNER_TEMP/josm19555-host/host-runtime.json"; then
            mkdir -p "build/reports/${{ matrix.report }}"
            cp "$RUNNER_TEMP/josm19555-host/host-runtime.json" "build/reports/${{ matrix.report }}/host-runtime.json"
          fi
      - name: Require diagnostic GUI summary after a passing run
        if: success()
        run: test -s build/reports/${{ matrix.report }}/summary.json
      - name: Write fixed diagnostic-only metadata
        if: always()
        env:
          G004_REPORT: ${{ matrix.report }}
          G004_ENGINE: ${{ matrix.engine }}
          G004_MODE: ${{ matrix.mode }}
          G004_ORDER: ${{ matrix.order }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("build/reports") / os.environ["G004_REPORT"] / "diagnostic-metadata.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          metadata = {
              "schema": "g004-gui-diagnostic-v1",
              "diagnosticOnly": True,
              "releaseQualified": False,
              "sourceCommit": os.environ["GITHUB_SHA"],
              "report": os.environ["G004_REPORT"],
              "engine": "LEGACY_V02",
              "engineRole": "expected",
              "savedEngine": os.environ["G004_ENGINE"],
              "mode": os.environ["G004_MODE"],
              "order": os.environ["G004_ORDER"],
          }
          output.write_text(json.dumps(metadata, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload diagnostic GUI evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g004-diagnostic-${{ matrix.report }}
          path: |
            build/reports/${{ matrix.report }}/summary.json
            build/reports/${{ matrix.report }}/host-runtime.json
            build/reports/${{ matrix.report }}/diagnostic-metadata.json
          if-no-files-found: ignore
          retention-days: 5

  legacy-normal-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare pinned JOSM 19555 host
        run: |
          python3 scripts/prepare-ci-josm19555.py --output-dir "$RUNNER_TEMP/josm19555-host"
          echo "ORG_GRADLE_PROJECT_josm19555HostJar=$RUNNER_TEMP/josm19555-host/JOSM-Linux-java11-19555.jar" >> "$GITHUB_ENV"
      - name: Run three fresh public Legacy normal-policy forks
        env:
          PERF_ROOT: ${{ runner.temp }}/legacy-normal-performance
        run: |
          mkdir -p "$PERF_ROOT"
          : > "$PERF_ROOT/invocations.txt"
          failed=0
          for fork in 0 1 2; do
            if sh gradlew legacyNormalPerformance \
                -PlegacyNormalPerformanceFork="$fork" \
                -PlegacyNormalPerformanceOutput="$PERF_ROOT/fork-$fork" \
                --console=plain; then
              result=0
            else
              result=$?
            fi
            printf 'fork=%s exit=%s\n' "$fork" "$result" >> "$PERF_ROOT/invocations.txt"
            if test "$result" -ne 0; then failed=1; fi
          done
          exit "$failed"
      - name: Gate raw fork results
        if: always()
        env:
          PERF_ROOT: ${{ runner.temp }}/legacy-normal-performance
        run: |
          python3 scripts/legacy-normal-performance-gate.py \
            --fork-dir "$PERF_ROOT/fork-0" \
            --fork-dir "$PERF_ROOT/fork-1" \
            --fork-dir "$PERF_ROOT/fork-2" \
            --report "$PERF_ROOT/gate-report.json"
      - name: Upload public Legacy normal-policy evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-legacy-normal-performance
          path: ${{ runner.temp }}/legacy-normal-performance/
          if-no-files-found: ignore
          retention-days: 5

  legacy-tracker-performance:
