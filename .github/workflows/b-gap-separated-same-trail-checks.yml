name: Fixed public separated same-trail control

on:
  push:
    branches: [codex/b-gap-separated-same-trail-20261020]

permissions:
  contents: read

jobs:
  same-trail-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run fixed pure geometry and source metadata preflight
        run: >-
          sh ./gradlew test
          --tests '*V022BSeparatedSameTrailTest'
          --tests '*V022BGapMatchedControlsTest.separatedSameTrailMetadataBindsOneSourceWithoutChangingPriorSchedules'
          --no-daemon --no-build-cache --rerun-tasks --console=plain
      - name: Preserve completed preflight reports
        run: |
          mkdir -p build/gap-separated-same-trail-preflight
          cp build/test-results/test/*V022BSeparatedSameTrailTest.xml build/gap-separated-same-trail-preflight/fixtures.xml
          cp build/test-results/test/*V022BGapMatchedControlsTest.xml build/gap-separated-same-trail-preflight/harness.xml
      - name: Run only the one fixed actual separated source control
        env:
          V022_RUN_SEPARATED_SAME_TRAIL_CONTROL: "true"
        run: >-
          sh ./gradlew test
          --tests '*V022BGapMatchedControlsTest.separatedSameTrailSourcePipelineProducesCompleteEightSettingMatrix'
          --no-daemon --no-build-cache --rerun-tasks --console=plain
      - name: Verify one actual eight-setting separated execution
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/gap-task5-matrix")
          ids = ["same-trail-three-separated-strong"]
          etas = [0, 1, 2, 4, 8, 16, 32, 64]
          summary = json.loads((root / "separated-same-trail-summary.json").read_text())
          if summary.get("expectedCases") != ids or summary.get("complete") is not True or summary.get("separatedSameTrailExecutionEnabled") is not True:
              raise SystemExit("Fixed same-trail source schedule incomplete")
          for identity in ids:
              receipt = json.loads((root / (identity + ".json")).read_text())
              if receipt.get("case") != identity or receipt.get("sourceCohort") != "ADDITIONAL_SEPARATED_SAME_TRAIL_ONE":
                  raise SystemExit("Fixed same-trail receipt binding changed")
              rows = receipt.get("rows", [])
              pipeline = receipt.get("sourcePipeline", {})
              if receipt.get("sourceCaseExecutionComplete") is not True or pipeline.get("failedPhase") is not None:
                  raise SystemExit("Fixed same-trail source pipeline failed")
              if pipeline.get("solverInvocations") != 8 or pipeline.get("solverReturns") != 8:
                  raise SystemExit("Expected eight actual solver calls and returns")
              if [row.get("eta") for row in rows] != etas:
                  raise SystemExit("Fixed same-trail setting inventory changed")
              for row in rows:
                  if row.get("actualSolve") is not True or row.get("work") in (None, "unavailable"):
                      raise SystemExit("Same-trail source slot was never executed")
                  if row.get("status") in (None, "RESOURCE_LIMIT", "NUMERIC_FAILURE"):
                      raise SystemExit("Same-trail source execution failed")
          print("8 actual fixed source solves verified; geometry outcomes are data, not model qualification")
          PY
      - name: Upload only fixed public synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-separated-same-trail-control
          path: |
            build/gap-separated-same-trail-preflight/fixtures.xml
            build/gap-separated-same-trail-preflight/harness.xml
            build/test-results/test/*V022BGapMatchedControlsTest.xml
            build/gap-task5-matrix/separated-same-trail-summary.json
            build/gap-task5-matrix/same-trail-three-separated-strong.json
            build/gap-separated-same-trail-matrix/native-fixtures.json
            build/gap-separated-same-trail-matrix/same-trail-three-separated-strong.f64
            build/gap-separated-same-trail-matrix/same-trail-three-separated-strong.valid
          if-no-files-found: error
          retention-days: 5
