name: Public B V6 budgeted source-frontier six-scene retention

on:
  workflow_dispatch:
  push:
    branches: ["codex/drasov-ab-rc16-integration-20261107"]

permissions:
  contents: read

jobs:
  public-budgeted-frontier-v6-retention:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare pinned JOSM 19555 host
        run: |
          python3 scripts/prepare-ci-josm19555.py --output-dir "$RUNNER_TEMP/josm19555-host"
          echo "ORG_GRADLE_PROJECT_josm19555HostJar=$RUNNER_TEMP/josm19555-host/JOSM-Linux-java11-19555.jar" >> "$GITHUB_ENV"
      - name: Record public source and pinned host evidence
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          output = pathlib.Path('build/reports/wide-budgeted-frontier-v6-source-evidence')
          output.mkdir(parents=True, exist_ok=False)
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['GITHUB_SHA']
          prefix = 'src/test/java/org/openstreetmap/josm/plugins/wayheatmaptracer/service/tracing/probabilistic/'
          paths = [prefix + name + '.java' for name in (
              'WideBudgetedFrontierRetentionMain', 'WideCompactQualityMain', 'WideCompactRetentionMain',
              'WideCompactScenes', 'WideCompactRetentionFlow', 'WideCompactRetentionAssessment')]
          production = 'src/main/java/org/openstreetmap/josm/plugins/wayheatmaptracer/'
          paths += [production + 'service/tracing/probabilistic/' + name + '.java' for name in (
              'BPolicy', 'BRefinementBudget', 'CompletedBPassWork', 'ProbabilisticInference',
              'AdaptiveBInference', 'AdmittedBInference', 'AdaptiveSolverView',
              'ProbabilisticTraceEngine', 'ProbabilisticProfileFactory')]
          paths += [production + 'diagnostics/replay/format15/' + name + '.java' for name in (
              'Format15BRefinementBudgetReceipt', 'Format15DenseBAdmissionReceipt', 'Format15ExecutionWorkCodec',
              'Format15NumericalPolicyReceipt', 'Format15ProductionBundleFactory', 'Format15ReplayRunner')]
          paths += [production + name for name in (
              'service/tracing/ModernTracePipeline.java', 'service/quality/FinalGeometryEvaluator.java',
              'actions/AlignWayAction.java')]
          paths += [
                    'src/test/resources/public-wide-compact-v1.properties', 'build.gradle.kts',
                    '.github/workflows/wide-budgeted-frontier-v6-retention.yml']
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--', *paths], check=True)
          receipt = {'schema': 1, 'sourceCommit': head, 'releaseQualified': False,
                     'files': {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in paths}}
          (output / 'source.json').write_text(json.dumps(receipt, indent=2) + '\n')
          host = pathlib.Path(os.environ['RUNNER_TEMP']) / 'josm19555-host'
          shutil.copyfile(host / 'host-runtime.json', output / 'josm19555-host.json')
          PY
      - name: Run all six actual native V6 budgeted compact retention assessments
        run: timeout 4800s sh gradlew --no-daemon --max-workers=1 v022WideBudgetedFrontierRetention -PvalidationProfile=public --console=plain
      - name: Upload scoped public V6 reports and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-wide-budgeted-frontier-v6-six-scene-retention
          path: |
            build/reports/wide-budgeted-frontier-v6-retention/
            build/reports/wide-budgeted-frontier-v6-source-evidence/
            src/test/resources/public-wide-compact-v1.properties
          if-no-files-found: error
          retention-days: 5
